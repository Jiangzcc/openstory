# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
#

pre-commit:
  commands:
    lint:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}'
      exclude:
        - 'mockServiceWorker.js'
        - '*.gen.ts'
        - 'src/ui/shadcn/*.tsx'
        - 'src/ui/shadcn/**/*.tsx'
        - 'containers/**'
      # Match .oxlintrc.json so an entirely ignored set skips the command.
      run: bun run --bun oxlint --type-aware --quiet {staged_files}
      stage_fixed: true
    format:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,sql,json,md}'
      exclude:
        - src/routeTree.gen.ts
        - public/mockServiceWorker.js
        - worker-configuration.d.ts
        - gen.types.ts
        - .vscode/settings.json
      run: bun run --bun oxfmt --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx,mts,cts}'
      run: bun run --bun tsgo --noEmit
      stage_fixed: true
    dead-code:
      # Whole-repo analysis (knip can't scope to staged files), ~1.5s. Gated
      # on globs that can change the import graph so docs/SQL-only commits
      # skip it. If a commit legitimately introduces a not-yet-consumed
      # export, wire up a consumer in the same commit or tag it `@public`.
      glob: '{*.{js,ts,cjs,mjs,jsx,tsx},package.json,knip.config.ts}'
      run: bun dead-code
    client-server-boundary:
      # Transitive import-graph walk (~1.3s). The per-file lint rule above
      # catches the direct shape; this catches the leak through a helper.
      glob: '{src,scripts}/**/*.{ts,tsx}'
      run: bun run test src/platform/client-server-boundary.test.ts
    migration-safety:
      glob: 'drizzle/migrations/**/*.sql'
      run: bun scripts/check-migrations.ts {staged_files}
    typegen-regen:
      # worker-configuration.d.ts is committed (Cloudflare's CI recommendation),
      # so a wrangler.jsonc change must ship the regenerated types with it —
      # stale committed types are how the old cloudflare-env.d.ts rotted.
      # `wrangler types` writes Env bindings plus the workerd runtime
      # declarations. Env-only output is ~300 lines (#2053) and typecheck
      # fails inside the file; under Bun the runtime fetch of http://dummy.com
      # can also exit 0 with a parking page (workers-sdk #16136). The script
      # runs on Node (the wrangler bin's shebang — not `bun run --bun`) and
      # restores the committed file unless the rewrite still has runtime
      # declarations and is at least half as long. (`wrangler types --check`
      # returns 0 against a provably stale file, so it is not the guard.)
      glob: 'wrangler.jsonc'
      run: bun scripts/regen-worker-types.ts && git add worker-configuration.d.ts
    workflow-trigger-safety:
      glob: '.github/workflows/*.{yml,yaml}'
      run: bun scripts/check-workflow-triggers.ts {staged_files}
